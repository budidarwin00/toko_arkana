<!DOCTYPE html>
<html><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {

}

  font-family: "Optimistic Mono", ui-monospace, monospace;

</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rekap Lembur - Sinkron</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:#f8fafc;padding:10px;font-size:13px;max-width:480px;margin:auto}
.top{display:flex;gap:8px;margin-bottom:10px;align-items:end}
.top label{font-size:11px;color:#64748b;display:block}
select,input{padding:8px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;width:100%;background:#fff}
.icon{width:48px;height:42px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;font-size:20px;flex-shrink:0;cursor:pointer}
.icon.dark{background:#0f172a;color:#fff}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px}
.card.green{background:#f0fdf4;border-color:#bbf7d0}.card.blue{background:#eff6ff;border-color:#bfdbfe}
.card small{color:#64748b;font-size:11px}.card b{font-size:15px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.btn-pdf{background:#fff;border:2px dashed #cbd5e1}.btn-save{background:#16a34a;color:#fff}
.btn-del{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.btn-del2{background:#fff;border:1px solid #e2e8f0}
#status{text-align:center;font-size:11px;color:#64748b;min-height:16px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #eef2f7;padding:10px 4px;text-align:center}th{color:#64748b;font-size:11px}
.badge{padding:3px 7px;border-radius:99px;font-size:10px;font-weight:700}.cocok{background:#dcfce7;color:#166534}.beda{background:#fef9c3;color:#854d0e}
.x{background:#fee2e2;color:#991b1b;border:none;border-radius:8px;width:28px;height:28px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:flex-end;justify-content:center}.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px}
.jam{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.jam button{padding:12px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;font-weight:700}.jam button.on{background:#0f172a;color:#fff}
</style></head><body>
<div class="top">
<div style="flex:1"><label>Bulan</label><select id="fBulan"><option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option><option value="3">Apr</option><option value="4">Mei</option><option value="5">Jun</option><option value="6">Jul</option><option value="7">Agu</option><option value="8">Sep</option><option value="9" selected>Okt</option><option value="10">Nov</option><option value="11">Des</option></select></div>
<div style="flex:1"><label>Tahun</label><select id="fTahun"><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select></div>
<button class="icon" onclick="openGP()">+</button>
<button class="icon dark" onclick="openM()">M</button>
</div>

<div class="cards">
<div class="card green"><small>Total PDF</small><b>TUL: <span id="tIdxPDF">0</span></b><span id="tUpPDF">Rp 0</span></div>
<div class="card blue"><small>Total Manual</small><b>TUL: <span id="tIdxMan">0</span></b><span id="tUpMan">Rp 0</span></div>
</div>

<div class="row">
<label class="btn btn-pdf" style="text-align:center;cursor:pointer">📄 PDF<input type="file" id="pdfFile" accept="application/pdf" hidden></label>
<button class="btn btn-save" onclick="simpan()">💾 Simpan</button>
</div>
<div class="row" style="margin-top:8px">
<button class="btn btn-del" onclick="hapusBulan()">🗑️ Hapus Bulan Ini</button>
<button class="btn btn-del2" onclick="hapusSemua()">🧹 Hapus Semua</button>
</div>
<div id="status">Siap • GP Rp 6.000.000</div>
<div style="text-align:center"><a href="#" onclick="bukaSheet();return false" style="color:#64748b;font-size:12px">Buka Sheet</a></div>

<div class="card" style="margin-top:8px"><table><thead><tr><th>TANGGAL</th><th>TUL 1</th><th>TUL 2</th><th>SELISIH</th><th>🗑️</th></tr></thead><tbody id="tbody"></tbody></table></div>

<!-- Modal Manual -->
<div class="modal" id="modalM"><div class="sheet"><b>Input Manual</b><p style="font-size:12px;color:#64748b">Tanggal & Jam — TUL auto</p>
<label>Tanggal</label><input type="date" id="mTgl">
<div class="jam" id="jamBtns"></div>
<div>Jam dipilih: <b id="jamInfo">-</b> → TUL <b id="tulInfo">-</b></div>
<button class="btn btn-save" onclick="addManual()">Simpan Manual</button>
<button class="btn btn-del2" onclick="closeM()">Tutup</button></div></div>

<!-- Modal GP -->
<div class="modal" id="modalGP"><div class="sheet"><b>Gaji Pokok (GP)</b><p style="font-size:12px;color:#64748b">Upah = TUL × (GP / 173)</p>
<input type="number" id="inputGP" value="6000000"><button class="btn btn-save" onclick="saveGP()">Save GP</button><button class="btn btn-del2" onclick="closeGP()">Tutup</button></div></div>

<script>
const API="https://script.google.com/macros/s/AKfycbx8RuEYkvpYkMJGnrvNnIic3Eqjeof_0ymFXjxaneSHhk85qbs6EW9nVdM0FRXznA9nzw/exec";
const SHEET_URL="https://docs.google.com/spreadsheets/d/153Q4t7MuOEPFxJN06yi44Lv2p4HZvuOqAvnKsceI0So/edit";
let data={}; // key YYYY-MM-DD -> {idx1, idx2}
let gp=6000000;
let jamSel=null;
const mapJam={1:1.5,2:3.5,3:5.5,4:7.5,5:10,6:12,7:14,8:17};
const tulValues=[1.5,3.5,5.5,7.5,10,12,14,17];

function today(){let d=new Date();document.getElementById('fBulan').value=d.getMonth();document.getElementById('fTahun').value=d.getFullYear();}
function setStatus(t){document.getElementById('status').textContent=t;}
function saveLocal(){localStorage.setItem('rekap_tul_v7',JSON.stringify({data,gp}));}
function loadLocal(){try{let s=JSON.parse(localStorage.getItem('rekap_tul_v7')||'null');if(s){data=s.data||{};gp=s.gp||6000000;document.getElementById('inputGP').value=gp;}}catch(e){}}
function bulanKey(){let b=parseInt(document.getElementById('fBulan').value);let y=document.getElementById('fTahun').value;return y+'-'+String(b+1).padStart(2,'0');}

function recalc(){
  // HANYA hitung per bulan yang dipilih
  let bk=bulanKey();let idx1=0,idx2=0;
  Object.keys(data).forEach(k=>{if(!k.startsWith(bk))return;let r=data[k];if(r.idx1!=='')idx1+=parseFloat(r.idx1)||0;if(r.idx2!=='')idx2+=parseFloat(r.idx2)||0;});
  document.getElementById('tIdxPDF').textContent=idx1;
  document.getElementById('tIdxMan').textContent=idx2;
  let upah=gp/173;
  document.getElementById('tUpPDF').textContent='Rp '+(idx1*upah).toLocaleString('id-ID');
  document.getElementById('tUpMan').textContent='Rp '+(idx2*upah).toLocaleString('id-ID');
  document.getElementById('status').textContent='Siap • GP Rp '+gp.toLocaleString('id-ID')+' • '+bk;
}
function render(){
  recalc();saveLocal();
  let bk=bulanKey();let tb=document.getElementById('tbody');tb.innerHTML='';
  Object.keys(data).filter(k=>k.startsWith(bk)).sort().forEach(k=>{
    let r=data[k];let sel='';if(r.idx1!==''&&r.idx2!=='')sel=(parseFloat(r.idx1)-parseFloat(r.idx2)).toFixed(1);
    let badge='';if(sel!=='')badge=Math.abs(parseFloat(sel))<0.01?'<span class="badge cocok">COCOK</span>':'<span class="badge beda">BEDA</span>';
    let dd=k.split('-')[2]+'/'+k.split('-')[1];
    tb.innerHTML+='<tr><td>'+dd+'</td><td>'+(r.idx1===''?'':r.idx1+'<br>'+badge)+'</td><td>'+(r.idx2===''?'':r.idx2)+'</td><td>'+(sel===''?'':sel+'<br>'+badge)+'</td><td><button class="x" onclick="hapusRow(\''+k+'\')">×</button></td></tr>';
  });
}
function openM(){document.getElementById('modalM').classList.add('open');let d=new Date();document.getElementById('mTgl').value=d.toISOString().slice(0,10);let c=document.getElementById('jamBtns');c.innerHTML='';[2,3,4,6,7,8].forEach(j=>{let b=document.createElement('button');b.textContent=j;b.onclick=()=>{jamSel=j;document.querySelectorAll('#jamBtns button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('jamInfo').textContent=j+' jam';document.getElementById('tulInfo').textContent=mapJam[j];};c.appendChild(b);});}
function closeM(){document.getElementById('modalM').classList.remove('open');}
function openGP(){document.getElementById('modalGP').classList.add('open');}
function closeGP(){document.getElementById('modalGP').classList.remove('open');}
function saveGP(){gp=parseFloat(document.getElementById('inputGP').value)||6000000;saveLocal();render();closeGP();simpan(true);}
function addManual(){if(!jamSel){alert('Pilih jam dulu');return;}let t=document.getElementById('mTgl').value;if(!t){alert('Pilih tanggal');return;}if(!data[t])data[t]={idx1:'',idx2:''};data[t].idx2=mapJam[jamSel];render();closeM();simpan(true);}
function hapusRow(k){if(!confirm('Hapus '+k+'?'))return;delete data[k];render();simpan(true);}
function hapusBulan(){if(!confirm('Hapus semua data bulan ini?'))return;let bk=bulanKey();Object.keys(data).forEach(k=>{if(k.startsWith(bk))delete data[k];});render();simpan(true);}
function hapusSemua(){if(!confirm('Hapus SEMUA data?'))return;data={};render();simpan(true);}
function bukaSheet(){window.open(SHEET_URL,'_blank');}

// === SINKRON KE SHEET ===
async function simpan(silent){
  saveLocal();
  let rows=Object.keys(data).sort().map(k=>{let r=data[k];return{tanggal:k, tul1:r.idx1===''?'':r.idx1, tul2:r.idx2===''?'':r.idx2, selisih:(r.idx1!==''&&r.idx2!=='')?(parseFloat(r.idx1)-parseFloat(r.idx2)):''};});
  if(!silent) setStatus('⏳ Menyimpan ke Sheet...');
  try{
    // Pakai text/plain agar tidak kena CORS preflight
    await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'save',gp:gp,rows:rows})});
    setStatus('✅ Tersimpan & Sinkron • '+new Date().toLocaleTimeString('id-ID'));
  }catch(e){ setStatus('⚠️ Tersimpan lokal, Sheet gagal: '+e.message+' — coba Simpan lagi'); }
}
async function loadFromSheet(){
  setStatus('⏳ Memuat dari Sheet...');
  try{
    let res=await fetch(API+'?action=load&t='+Date.now());
    let j=await res.json();
    if(j && j.rows && j.rows.length){
      let nd={};
      j.rows.forEach(r=>{let t=r.tanggal; if(!t) return; // normalisasi tanggal ke YYYY-MM-DD
        let iso=t; if(t.includes('/')){let p=t.split('/'); iso=p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');} else if(t.includes('T')) iso=t.slice(0,10);
        nd[iso]={idx1:r.tul1===''?'':String(r.tul1), idx2:r.tul2===''?'':String(r.tul2)};});
      data=nd; if(j.gp) {gp=parseFloat(j.gp); document.getElementById('inputGP').value=gp;}
      saveLocal(); render(); setStatus('✅ Dimuat dari Sheet • '+Object.keys(data).length+' tanggal');
    } else { setStatus('Sheet kosong — pakai data lokal'); render(); }
  }catch(e){ setStatus('⚠️ Gagal load Sheet, pakai lokal: '+e.message); render(); }
}

// === PDF PARSER ROBUST: per baris No. 0425, Indeks = angka ke-2 dari akhir ===
document.getElementById('pdfFile').addEventListener('change', async function(e){
  let file=e.target.files[0]; if(!file) return;
  setStatus('⏳ Membaca PDF...');
  try{
    let buf=await file.arrayBuffer(); let pdf=await pdfjsLib.getDocument({data:buf}).promise; let fullText='';
    for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i);let c=await page.getTextContent();fullText+='\n'+c.items.map(x=>x.str).join(' ');}
    let extracted=[];
    let rowRegex=/(\d+)\.\s+0425/g; let rms=[]; let rm; while((rm=rowRegex.exec(fullText))!==null){rms.push({index:rm.index});}
    let months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12',Oktober:'10'};
    if(rms.length>=3){
      rms.forEach((r,i)=>{let s=r.index;let en=rms[i+1]?rms[i+1].index:fullText.length;let row=fullText.substring(s,Math.min(en,s+1000));
        let dm=row.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|Oktober)\s+(\d{4})/i); if(!dm) return;
        let mm=months[dm[2].substring(0,3)]||months[dm[2]]||'10'; let iso=dm[3]+'-'+mm+'-'+String(dm[1]).padStart(2,'0');
        let nums=row.match(/\d+(?:\.\d+)?/g); if(!nums||nums.length<4) return;
        let len=nums.length; let indeks=parseFloat(nums[len-2]); let jam=parseFloat(nums[len-3]);
        let found=null; if(tulValues.indexOf(indeks)!==-1) found=indeks; else if(mapJam[jam]) found=mapJam[jam];
        if(found!==null) extracted.push({tgl:iso, idx:found});
      });
    }
    if(!extracted.length){ setStatus('❌ PDF tidak terbaca — coba PDF Employee Overtime Report'); return; }
    extracted.forEach(x=>{if(!data[x.tgl])data[x.tgl]={idx1:'',idx2:''}; data[x.tgl].idx1=String(x.idx);});
    render(); setStatus('✅ PDF: '+extracted.length+' baris • Cek TUL 1 lalu Simpan');
  }catch(err){ setStatus('❌ Gagal baca PDF: '+err.message); }
  e.target.value='';
});
document.getElementById('fBulan').addEventListener('change',render);
document.getElementById('fTahun').addEventListener('change',render);
today(); loadLocal(); render(); loadFromSheet();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
