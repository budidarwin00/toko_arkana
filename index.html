<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AREA EF - Anggota GP+POTONGAN</title>
<style>*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#F8FAFC}.wrap{max-width:480px;margin:0 auto;background:#F8FAFC;min-height:100vh;padding-bottom:80px}.header{height:56px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-bottom:1px solid #E5E7EB;position:sticky;top:0;z-index:30}.pill{padding:6px 12px;background:#F1F5F9;border:1px solid #E5E7EB;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}.pillGP{background:#000;color:#fff;border-color:#000}.panel{position:absolute;top:44px;right:0;background:#fff;border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:120px;display:none;z-index:40;overflow:hidden}.panel button{width:100%;padding:10px;text-align:left;border:none;background:#fff;cursor:pointer;font-size:13px;font-weight:600}.panelGP{width:220px;right:0;padding:12px;display:none}.card{background:#fff;border-radius:18px;margin:10px 12px;padding:16px;border:1px solid #F1F5F9}.riwayatCard{background:#fff;border-radius:14px;padding:12px;margin:0 12px 8px 12px;border:1px solid #F1F5F9}.authWrap{max-width:380px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px;background:#F8FAFC}.authCard{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.05);border:1px solid #E5E7EB}.inp{width:100%;height:44px;border:2px solid #000;border-radius:12px;padding:0 12px;font-weight:600;font-size:14px;margin-top:10px;outline:none}.btnBlack{width:100%;height:44px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:14px}.tabRow{display:flex;gap:6px;margin-top:12px}.tab{flex:1;height:32px;border-radius:20px;border:1px solid #E5E7EB;background:#F8FAFC;font-weight:600;font-size:12px;cursor:pointer}.tab.active{background:#000;color:#fff;border-color:#000}.debug{font-size:10px;color:#16A34A;background:#F0FDF4;padding:6px 10px;border-radius:8px;margin-top:8px;text-align:center;font-weight:700}</style></head><body>
<div id="authScreen" class="authWrap"><div style="text-align:center;margin-bottom:20px"><b style="font-size:26px">AREA EF</b><div style="font-size:11px;opacity:.5;letter-spacing:.15em;font-weight:700">ANGGOTA</div></div><div class="authCard"><div class="tabRow"><button id="tabLogin" class="tab active" type="button" onclick="switchTab('login')">Login</button><button id="tabDaftar" class="tab" type="button" onclick="switchTab('daftar')">Daftar</button></div><div id="loginForm"><div style="font-size:14px;font-weight:800;margin-top:12px">Masuk Anggota</div><input id="loginNama" class="inp" placeholder="Nama" list="namaListOpt"><datalist id="namaListOpt"></datalist><input id="loginPass" type="password" class="inp" placeholder="Password"><button class="btnBlack" type="button" onclick="doLogin()">LOGIN</button><div id="loginMsg" style="font-size:11px;color:#EF4444;margin-top:8px;min-height:14px"></div></div><div id="daftarForm" style="display:none"><div style="font-size:14px;font-weight:800;margin-top:12px">Daftar</div><input id="regNama" class="inp" placeholder="Nama" list="namaListOpt2"><datalist id="namaListOpt2"></datalist><input id="regTgl" type="text" class="inp" placeholder="Tgl Lahir: 1995-01-15"><input id="regPass" type="password" class="inp" placeholder="Password min 4"><button class="btnBlack" type="button" onclick="doDaftar()">DAFTAR</button><div id="daftarMsg" style="font-size:11px;color:#EF4444;margin-top:8px;min-height:14px"></div></div></div></div>
<div id="appScreen" class="wrap" style="display:none"><div class="header"><b style="white-space:nowrap;font-size:13px">AREA EF | <span id="hNama">-</span></b><div style="display:flex;gap:4px;align-items:center"><div style="position:relative"><div class="pill" onclick="toggleB()"><span id="bBtn">Okt</span></div><div class="panel" id="bPanel"></div></div><div style="position:relative"><div class="pill" onclick="toggleT()"><span id="tBtn">2026</span></div><div class="panel" id="tPanel"></div></div><div style="position:relative"><div class="pill pillGP" onclick="toggleGP()">GP+</div><div class="panel panelGP" id="gpPanel"><div style="font-size:10px;font-weight:700;opacity:.6;letter-spacing:.06em">INPUT GP</div><input id="gpInputHeader" type="text" inputmode="numeric" placeholder="7200000" style="width:100%;height:40px;border:2px solid #000;border-radius:8px;padding:0 8px;font-weight:700;margin-top:6px" oninput="this.value=this.value.replace(/[^0-9]/g,'')" /><div style="font-size:10px;font-weight:700;opacity:.6;letter-spacing:.06em;margin-top:10px">POTONGAN %</div><div style="display:flex;gap:6px;align-items:center;margin-top:6px"><input id="potonganInputHeader" type="text" inputmode="decimal" placeholder="10" style="flex:1;height:40px;border:2px solid #000;border-radius:8px;padding:0 8px;font-weight:700" oninput="this.value=this.value.replace(/[^0-9.]/g,'')" /><span style="font-weight:800">%</span></div><button onclick="saveGPFromHeader()" type="button" style="width:100%;height:36px;background:#000;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer">SIMPAN</button></div></div><div class="pill" onclick="doLogout()" style="background:#EF4444;color:#fff;border-color:#EF4444">KELUAR</div></div></div><div class="card"><div id="totalList"></div><div id="debugInfo" class="debug">Sinkron Sheet...</div></div><div style="padding:0 12px;font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.5">RIWAYAT SAYA</div><div id="riwayatList" style="margin-top:6px"></div></div>
<script>
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbylrqytsyq-ZKx1azc945HmvxYjB_9gPOE5YxpHVE5BeQdjCgu9ELZ3Gh-plif5N1a1/exec';
const bulanList=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const tahunList=['2025','2026','2027','2028'];
const jamMap={"2":3.5,"3":5.5,"4":7.5,"6":12,"7":14,"8":17};
const namaList=["Arief","Topik","Yudi","Putri","Budi","Dozen","Syarif","Nely","Zaelani","Nia","Eka","Supriyadi","Aaf","Aditya","Anah","Anisa"];
let bulan='Okt',tahun='2026',riwayat=[];
const USERS_KEY='area_ef_users';const SESSION_KEY='area_ef_session';
let currentUser=null;
function normalizeNama(s){if(!s) return '';let l=String(s).toLowerCase().trim();for(let n of namaList){if(n.toLowerCase()===l) return n;}for(let n of namaList){if(l.includes(n.toLowerCase())) return n;}return s.trim();}
function normBulan(s){if(!s) return 'Okt';let v=String(s).trim();return v.charAt(0).toUpperCase()+v.slice(1,3).toLowerCase();}
function normTahun(s){if(!s) return '2026';return String(s).trim().substring(0,4);}
function findAnggota(input){let norm=normalizeNama(input);return namaList.includes(norm)?norm:null;}
function loadUsers(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||'[]');}catch(e){return []}}
function saveUsers(u){localStorage.setItem(USERS_KEY, JSON.stringify(u));}
function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}}
function setSession(u){localStorage.setItem(SESSION_KEY, JSON.stringify(u));}
function clearSession(){localStorage.removeItem(SESSION_KEY);}
function switchTab(t){document.getElementById('loginForm').style.display=t==='login'?'block':'none';document.getElementById('daftarForm').style.display=t==='daftar'?'block':'none';document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('tabDaftar').classList.toggle('active',t==='daftar');}
function initAuth(){let opt='';namaList.forEach(n=>{opt+=`<option value="${n}">`});document.getElementById('namaListOpt').innerHTML=opt;document.getElementById('namaListOpt2').innerHTML=opt;let sess=getSession();if(sess){currentUser=sess;showApp();}else{showAuth();}initPanels();loadFromSheet();}
function showAuth(){document.getElementById('authScreen').style.display='flex';document.getElementById('appScreen').style.display='none';}
function showApp(){if(!currentUser){showAuth();return;}document.getElementById('authScreen').style.display='none';document.getElementById('appScreen').style.display='block';document.getElementById('hNama').innerText=currentUser.nama;loadFromSheet();}
function doDaftar(){let namaInput=document.getElementById('regNama').value.trim();let tgl=document.getElementById('regTgl').value.trim();let pass=document.getElementById('regPass').value;let msgEl=document.getElementById('daftarMsg');if(!namaInput||!tgl||!pass){msgEl.innerText='Lengkapi';return;}if(pass.length<4){msgEl.innerText='Password min 4';return;}let anggota=findAnggota(namaInput);if(!anggota){msgEl.innerText='Nama harus anggota';return;}let nama=anggota;let users=loadUsers();if(users.find(u=>u.nama.toLowerCase()===nama.toLowerCase())){msgEl.innerText='Sudah terdaftar';switchTab('login');return;}users.push({nama,tglLahir:tgl,pass,role:'anggota'});saveUsers(users);msgEl.style.color='#10B981';msgEl.innerText='Berhasil!';setTimeout(()=>switchTab('login'),600);}
function doLogin(){let namaInput=document.getElementById('loginNama').value.trim();let pass=document.getElementById('loginPass').value;let msgEl=document.getElementById('loginMsg');if(!namaInput||!pass){msgEl.innerText='Isi Nama & Password';return;}let anggota=findAnggota(namaInput);let namaCek=anggota||normalizeNama(namaInput);let users=loadUsers();let u=users.find(x=>x.nama.toLowerCase()===namaCek.toLowerCase());if(!u){if(findAnggota(namaCek)){currentUser={nama:findAnggota(namaCek),role:'anggota'};setSession(currentUser);showApp();return;}msgEl.innerText='Belum daftar';return;}if(u.pass!==pass){msgEl.innerText='Password salah';return;}currentUser={nama:u.nama,role:u.role};setSession(currentUser);showApp();}
function doLogout(){clearSession();currentUser=null;showAuth();}
function fmt(n){return (''+n).replace('.',',')}

// POTONGAN - DEFAULT 10%
function getPotongan(){
  let key='area_ef_potongan_'+(currentUser?currentUser.nama:'global');
  let v=localStorage.getItem(key);if(v===null) v=localStorage.getItem('area_ef_potongan_global');
  if(v===null||v==='') return 10;
  let num=parseFloat(v);if(isNaN(num)) return 10;return num;
}
function setPotongan(val){
  if(val===''||val===null) val=10;
  let num=parseFloat(val);if(isNaN(num)) num=10;
  if(num<0) num=0;if(num>100) num=100;
  let key='area_ef_potongan_'+(currentUser?currentUser.nama:'global');
  localStorage.setItem(key,String(num));
  localStorage.setItem('area_ef_potongan_global',String(num));
  return num;
}

function loadFromSheet(){fetch(WEBAPP_URL+'?action=load&t='+Date.now()).then(r=>r.json()).then(data=>{if(data.riwayat){riwayat=data.riwayat.map(r=>({tgl:String(r.tgl||'').trim(),bulan:normBulan(r.bulan),tahun:normTahun(r.tahun),jam:String(r.jam||'').trim(),orang:(r.orang||[]).map(o=>normalizeNama(o))}));let countBulan=riwayat.filter(r=>r.bulan===bulan&&r.tahun===tahun&&r.orang.includes(currentUser?currentUser.nama:'')).length;let el=document.getElementById('debugInfo');if(el) el.innerText=`Sinkron OK | ${bulan} ${tahun}:${countBulan} | Total:${riwayat.length}`;renderAll();}}).catch(e=>{});}
function initPanels(){document.getElementById('bPanel').innerHTML=bulanList.map(b=>`<button onclick="pilihB('${b}')">${b}</button>`).join('');document.getElementById('tPanel').innerHTML=tahunList.map(t=>`<button onclick="pilihT('${t}')">${t}</button>`).join('');}
function closeAll(){['bPanel','tPanel','gpPanel'].forEach(id=>{let el=document.getElementById(id);if(el) el.style.display='none';})}
function toggleB(){let p=document.getElementById('bPanel');let s=p.style.display!=='block';closeAll();p.style.display=s?'block':'none';}
function toggleT(){let p=document.getElementById('tPanel');let s=p.style.display!=='block';closeAll();p.style.display=s?'block':'none';}
function toggleGP(){let p=document.getElementById('gpPanel');let s=p.style.display!=='block';closeAll();if(s){p.style.display='block';let inp=document.getElementById('gpInputHeader');if(inp){inp.value=getGP();}let inp2=document.getElementById('potonganInputHeader');if(inp2){inp2.value=getPotongan();}if(inp) inp.focus();}else p.style.display='none';}
function pilihB(b){bulan=b;document.getElementById('bBtn').innerText=b;closeAll();renderAll();loadFromSheet();}
function pilihT(t){tahun=t;document.getElementById('tBtn').innerText=t;closeAll();renderAll();loadFromSheet();}
function getGP(){let v=localStorage.getItem('area_ef_gp_'+(currentUser?currentUser.nama:'global'));if(v===null||v==='') v=localStorage.getItem('area_ef_gp_global');if(v===null||v==='') v='0';let num=parseFloat(v);return isNaN(num)?0:num;}
function setGP(val){if(val===null||val==='') val='0';if(currentUser) localStorage.setItem('area_ef_gp_'+currentUser.nama,val);localStorage.setItem('area_ef_gp_global',val);}
function saveGPFromHeader(){
  let el=document.getElementById('gpInputHeader');let val=el.value||'0';setGP(val);
  let el2=document.getElementById('potonganInputHeader');let val2=el2.value||'10';setPotongan(val2);
  closeAll();renderAll();
}
function fmtRupiah(n){return 'Rp '+Math.round(n).toLocaleString('id-ID');}
function hitung(){let total=0;riwayat.forEach(r=>{if(normBulan(r.bulan).toLowerCase()===bulan.toLowerCase()&&normTahun(r.tahun)===tahun&&r.orang.includes(currentUser.nama)){total+=jamMap[r.jam]||0;}});return total;}
function getBulanFull(b){const map={'Jan':'Januari','Feb':'Februari','Mar':'Maret','Apr':'April','Mei':'Mei','Jun':'Juni','Jul':'Juli','Agu':'Agustus','Sep':'September','Okt':'Oktober','Nov':'November','Des':'Desember'};return map[b]||b;}
function renderAll(){
let total=hitung();let gp=getGP();let potongan=getPotongan();
let nominalTanpa=total*gp/173;
let nominalDengan=nominalTanpa*(1-potongan/100);
document.getElementById('totalList').innerHTML=`
<div style="text-align:center;padding:8px 0">
  <div style="font-size:48px;font-weight:900;line-height:1">${fmt(total)}</div>
  <div style="margin-top:12px;display:flex;gap:8px">
    <div style="flex:1;background:#F8FAFC;border:1px solid #E5E7EB;border-radius:12px;padding:10px">
      <div style="font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.5">TANPA POTONGAN</div>
      <div style="font-size:14px;font-weight:900;margin-top:4px">${fmtRupiah(nominalTanpa)}</div>
    </div>
    <div style="flex:1;background:#000;border-radius:12px;padding:10px">
      <div style="font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.6;color:#fff">DENGAN POTONGAN ${potongan}%</div>
      <div style="font-size:14px;font-weight:900;margin-top:4px;color:#fff">${fmtRupiah(nominalDengan)}</div>
    </div>
  </div>
</div>`;
let list=riwayat.filter(r=>normBulan(r.bulan).toLowerCase()===bulan.toLowerCase()&&normTahun(r.tahun)===tahun&&r.orang.includes(currentUser.nama));if(list.length===0){document.getElementById('riwayatList').innerHTML=`<div style="text-align:center;padding:16px;color:#94A3B8">Belum ada riwayat di ${bulan} ${tahun}</div>`;return;}list.sort((a,b)=>parseInt(a.tgl)-parseInt(b.tgl));let html='';list.forEach(r=>{let bulanFull=getBulanFull(normBulan(r.bulan));let tahunFull=normTahun(r.tahun);let tglFull=`${r.tgl} ${bulanFull} ${tahunFull}`;let jamDisplay=r.jam?` - Jam ${r.jam}`:'';html+=`<div class="riwayatCard"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:14px;font-weight:700">${tglFull}${jamDisplay}</div><div style="width:32px;height:32px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px">${r.jam||''}</div></div></div>`;});document.getElementById('riwayatList').innerHTML=html;}
initAuth();
document.addEventListener('click',e=>{let ids=['bPanel','tPanel','gpPanel'];let inside=false;ids.forEach(id=>{if(e.target.closest('#'+id)) inside=true;});if(e.target.closest('[onclick^="toggle"]')) inside=true;if(!inside) closeAll();});
</script></body></html>
