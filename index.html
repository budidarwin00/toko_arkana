</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rekap TUL - Fix Fast</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f8fafc;padding:10px;font-size:13px;max-width:500px;margin:auto}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.filter{display:grid;grid-template-columns:1fr 1fr 44px 44px;gap:6px;margin-bottom:8px}
.filter .card{margin:0;padding:6px 8px;display:flex;flex-direction:column;justify-content:center}
.filter select,.filter input{padding:6px 4px;font-size:12px;border:1px solid #d1d5db;border-radius:8px;width:100%;background:#fff}
.icon-btn{font-size:20px;font-weight:300;line-height:1;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none}
.icon-btn:active{transform:scale(0.95)}
.top{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.top .card{padding:8px;margin:0}
table{width:100%;border-collapse:collapse;font-size:12px} th,td{border-bottom:1px solid #f1f5f9;padding:9px 4px;text-align:center}
th{font-weight:700;color:#6b7280;font-size:10px;text-transform:uppercase;background:#f9fafb}
.badge{padding:2px 6px;border-radius:99px;font-size:9px;font-weight:700}
.cocok{background:#dcfce7;color:#166534} .beda{background:#fef9c3;color:#854d0e} .hanya{background:#fee2e2;color:#991b1b}
.scroll{max-height:460px;overflow:auto}
.btn{padding:12px;border:none;border-radius:10px;background:#111827;color:#fff;font-weight:700;width:100%;margin-top:10px;font-size:13px;cursor:pointer}
.jam-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.jam-btn{padding:12px 2px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.jam-btn.active{background:#111827;color:#fff;border-color:#111827}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:700;font-size:14px}
.cal-month-btn{padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;font-weight:700;width:auto;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-day{padding:10px 2px;border-radius:10px;text-align:center;font-size:13px;cursor:pointer;background:#fff;border:1px solid transparent}
.cal-day.active{background:#111827;color:#fff}
.cal-day.empty{border:none;visibility:hidden}
.cal-weekday{font-size:10px;color:#9ca3af;font-weight:600;text-align:center;padding:4px}
</style></head><body>

<div class="filter">
<div class="card"><div style="font-size:10px;color:#6b7280">Bulan</div><select id="fBulan"></select></div>
<div class="card"><div style="font-size:10px;color:#6b7280">Tahun</div><select id="fTahun"></select></div>
<div class="card icon-btn" onclick="toggleGP()" id="btnGP">+</div>
<div class="card icon-btn" onclick="toggleManual()" id="btnManual" style="background:#111827;color:#fff">M</div>
</div>

<div class="card" id="cardGP" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Gaji Pokok</b><button onclick="toggleGP()" style="border:none;background:#f1f5f9;border-radius:99px;width:28px;height:28px;font-weight:700;cursor:pointer">×</button></div>
<input id="inputGP" type="number" value="5000000" style="margin-top:8px;width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:13px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<button onclick="saveGP()" style="padding:10px;border:none;border-radius:10px;background:#111827;color:#fff;font-weight:700;font-size:12px;cursor:pointer">💾 Simpan GP</button>
<button onclick="toggleGP()" style="padding:10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-weight:700;font-size:12px;cursor:pointer">Tutup</button>
</div>
<div style="font-size:11px;color:#6b7280;margin-top:6px">Rumus: TUL × (GP / 173)</div>
<div id="gpStatus" style="font-size:11px;color:#16a34a;margin-top:6px;display:none"></div>
</div>

<div class="top">
<div class="card" style="background:#f0fdf4"><div style="font-size:10px;color:#6b7280">Total PDF</div><div style="font-weight:700;margin-top:2px;font-size:13px">TUL: <span id="tIdxPDF">0</span></div><div style="font-size:11px;margin-top:2px" id="tUpPDF">Rp 0</div></div>
<div class="card" style="background:#eff6ff"><div style="font-size:10px;color:#6b7280">Total Manual</div><div style="font-weight:700;margin-top:2px;font-size:13px">TUL: <span id="tIdxMan">0</span></div><div style="font-size:11px;margin-top:2px" id="tUpMan">Rp 0</div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">
<div class="card" id="cardPDF" style="padding:0;margin:0;display:flex;align-items:center;justify-content:center">
<label for="pdfFile" style="display:block;padding:12px;text-align:center;cursor:pointer;background:#f9fafb;border-radius:14px;border:2px dashed #d1d5db;font-weight:600;font-size:12px;width:100%">📄 PDF</label>
<input type="file" id="pdfFile" accept="application/pdf" style="position:absolute;left:-9999px">
</div>
<div class="card" style="padding:0;margin:0;overflow:hidden;display:flex;flex-direction:column">
<button class="btn" id="btnSaveSheet" onclick="saveToSheet()" style="margin:0;border-radius:14px;background:#16a34a;flex:1;font-size:12px;padding:12px">💾 Simpan</button>
</div>
</div>
<div id="saveStatus" style="padding:8px;text-align:center;font-size:11px;color:#6b7280;display:none"></div>
<div style="text-align:center;margin-bottom:8px"><a href="#" onclick="setWebAppUrl();return false;" style="font-size:10px;color:#6b7280;text-decoration:underline">Set Web App URL</a> | <a href="https://docs.google.com/spreadsheets/d/153Q4t7MuOEPFxJN06yi44Lv2p4HZvuOqAvnKsceI0So/edit" target="_blank" style="font-size:10px;color:#16a34a;font-weight:700">Buka Sheet</a></div>

<div class="card" id="cardManual" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Input Manual - Tanggal & Jam</b><button onclick="toggleManual()" style="border:none;background:#f1f5f9;border-radius:99px;width:28px;height:28px;font-weight:700;cursor:pointer">×</button></div>
<div class="cal-header">
<button class="cal-month-btn" onclick="changeMonth(-1)"><</button>
<span id="calMonthYear">Oktober 2026</span>
<button class="cal-month-btn" onclick="changeMonth(1)">></button>
</div>
<div class="cal-grid" id="calGrid"></div>
<div class="jam-grid">
<button class="jam-btn" onclick="setJam(1)">1j</button>
<button class="jam-btn" onclick="setJam(2)">2j</button>
<button class="jam-btn" onclick="setJam(3)">3j</button>
<button class="jam-btn active" onclick="setJam(4)">4j</button>
<button class="jam-btn" onclick="setJam(5)">5j</button>
<button class="jam-btn" onclick="setJam(6)">6j</button>
<button class="jam-btn" onclick="setJam(7)">7j</button>
<button class="jam-btn" onclick="setJam(8)">8j</button>
</div>
<button class="btn" onclick="addManual()">Tambah</button>
</div>

<div class="card" style="padding:0;overflow:hidden">
<div class="scroll">
<table id="tblRiwayat"><thead><tr><th>Tanggal</th><th>TUL 1</th><th>TUL 2</th><th>Selisih</th></tr></thead><tbody></tbody></table>
</div>
</div>

<script>
// === CONFIG & STORAGE ===
const DEFAULT_WEBAPP = 'https://script.google.com/macros/s/AKfycbx8RuEYkvpYkMJGnrvNnIic3Eqjeof_0ymFXjxaneSHhk85qbs6EW9nVdM0FRXznA9nzw/exec';
let WEBAPP_URL = localStorage.getItem('TUL_WEBAPP_URL') || DEFAULT_WEBAPP;
localStorage.setItem('TUL_WEBAPP_URL', WEBAPP_URL);

let selectedTglManual=null;
let selectedJam=4;
let data;
try{ 
  var raw=localStorage.getItem('TUL_DATA');
  data = raw ? JSON.parse(raw) : {}; 
} catch(e){ data={}; }
if(!data || typeof data!=='object') data={};

const mapIdx={1:1.5,2:3.5,3:5.5,4:7.5,5:10,6:12,7:14,8:17};
const monthNames=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let currentCal=new Date();

function getIdx(j){return mapIdx[j]||0;}
function setJam(j){
 selectedJam=j;
 document.querySelectorAll('.jam-btn').forEach(b=>b.classList.remove('active'));
 event.target.closest('.jam-btn').classList.add('active');
}
function toggleGP(){
 var c=document.getElementById('cardGP');
 c.style.display=c.style.display==='none'?'block':'none';
}
function toggleManual(){
 var c=document.getElementById('cardManual');
 c.style.display=c.style.display==='none'?'block':'none';
}
function getEntriesForSheet(){
  var entries=[];
  Object.keys(data).forEach(function(k){
    if(data[k].idx1!==''||data[k].idx2!==''){
      var p=k.split('-');
      var tglStr=p[2]+'/'+p[1]+'/'+p[0];
      var tul1=data[k].idx1; var tul2=data[k].idx2;
      var selisih='';
      if(tul1!==''&&tul2!=='') selisih=(parseFloat(tul1)-parseFloat(tul2));
      else if(tul1!=='') selisih=tul1;
      else selisih='-'+tul2;
      var gp=document.getElementById('inputGP').value||5000000;
      var upah=gp/173;
      var ket='';
      if(tul1!==''&&tul2!=='') ket=Math.abs(parseFloat(tul1)-parseFloat(tul2))<0.01?'COCOK':'BEDA';
      else if(tul1!=='') ket='HANYA PDF';
      else ket='HANYA MANUAL';
      entries.push({tanggal:tglStr, tul1:tul1, tul2:tul2, selisih:selisih, gp:gp, upahPDF:tul1? (parseFloat(tul1)*upah):'', upahMan:tul2? (parseFloat(tul2)*upah):'', ket:ket});
    }
  });
  return entries;
}

async function saveToSheet(){
  const statusEl=document.getElementById('saveStatus');
  const btn=document.getElementById('btnSaveSheet');
  const t0=Date.now();
  statusEl.style.display='block';
  statusEl.innerHTML='⏳ Menyimpan...';
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ Menyimpan...'; }
  
  const entries=getEntriesForSheet();
  if(entries.length===0){ statusEl.innerHTML='❌ Tidak ada data'; if(btn){btn.disabled=false; btn.innerHTML='💾 Simpan';} return; }
  
  const bulan=document.getElementById('fBulan').value;
  const tahun=document.getElementById('fTahun').value;
  const payload={entries:entries, bulan:bulan, tahun:tahun};
  
  try{
    const qs=encodeURIComponent(JSON.stringify(payload));
    const url=WEBAPP_URL+'?data='+qs;
    const res=await fetch(url);
    const txt=await res.text();
    const dt=((Date.now()-t0)/1000).toFixed(1);
    let ok=txt.includes('success')||txt.includes('SAVED')||txt.includes('ok');
    if(ok){
      statusEl.innerHTML=`✅ Sinkron ${entries.length} baris (${dt}s) <a href="https://docs.google.com/spreadsheets/d/153Q4t7MuOEPFxJN06yi44Lv2p4HZvuOqAvnKsceI0So/edit" target="_blank" style="color:#16a34a;font-weight:700;text-decoration:underline">Buka Sheet</a>`;
      if(btn){ btn.disabled=false; btn.innerHTML='✅ Tersimpan'; setTimeout(()=>{btn.innerHTML='💾 Simpan';},2000); }
      localStorage.setItem('TUL_LAST_SYNC', new Date().toISOString());
      return;
    } else throw new Error('GET not success: '+txt.substring(0,100));
  }catch(e){
    try{
      await fetch(WEBAPP_URL, {method:'POST', mode:'no-cors', body: JSON.stringify(payload)});
      const dt=((Date.now()-t0)/1000).toFixed(1);
      statusEl.innerHTML=`✅ Terkirim ${entries.length} baris (${dt}s) <a href="https://docs.google.com/spreadsheets/d/153Q4t7MuOEPFxJN06yi44Lv2p4HZvuOqAvnKsceI0So/edit" target="_blank" style="color:#16a34a;font-weight:700">Buka Sheet</a> | <a href="#" onclick="simpanViaGET();return false;" style="color:#2563eb;font-weight:700">Coba GET</a>`;
      if(btn){ btn.disabled=false; btn.innerHTML='✅ Terkirim'; setTimeout(()=>{btn.innerHTML='💾 Simpan';},2000); }
    }catch(e2){
      const dt=((Date.now()-t0)/1000).toFixed(1);
      statusEl.innerHTML=`⚠️ Gagal (${dt}s): ${e.message}<br><a href="#" onclick="simpanViaGET();return false;" style="display:inline-block;margin-top:6px;padding:8px 14px;background:#2563eb;color:#fff;border-radius:8px;text-decoration:none;font-weight:700">🚀 Simpan via GET (Cepat)</a>`;
      if(btn){ btn.disabled=false; btn.innerHTML='💾 Simpan'; }
    }
  }
}

function simpanViaGET(){
  const entries=getEntriesForSheet();
  const bulan=document.getElementById('fBulan').value;
  const tahun=document.getElementById('fTahun').value;
  const payload={entries:entries, bulan:bulan, tahun:tahun};
  const qs=encodeURIComponent(JSON.stringify(payload));
  const url=WEBAPP_URL+'?data='+qs;
  window.open(url,'_blank');
  document.getElementById('saveStatus').style.display='block';
  document.getElementById('saveStatus').innerHTML='🚀 Membuka tab save... tunggu 2 detik lalu <a href="https://docs.google.com/spreadsheets/d/153Q4t7MuOEPFxJN06yi44Lv2p4HZvuOqAvnKsceI0So/edit" target="_blank" style="color:#16a34a;font-weight:700">Buka Sheet & Refresh</a>';
}

function setWebAppUrl(){
  var current=localStorage.getItem('TUL_WEBAPP_URL')||'';
  var url=prompt('Paste Web App URL dari Apps Script (https://script.google.com/macros/s/.../exec):', current);
  if(url){
    localStorage.setItem('TUL_WEBAPP_URL', url);
    WEBAPP_URL=url;
    alert('URL disimpan! Sekarang tombol Simpan akan auto kirim ke Sheet');
  }
}

function initFilters(){
 var savedGP = localStorage.getItem('TUL_GP');
 var savedBulan = localStorage.getItem('TUL_BULAN');
 var savedTahun = localStorage.getItem('TUL_TAHUN');
 var fBulan=document.getElementById('fBulan');
 var fTahun=document.getElementById('fTahun');
 var bulanNames=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
 fBulan.innerHTML='';
 bulanNames.forEach(function(n,i){ var o=document.createElement('option'); o.value=i; o.textContent=n; if(savedBulan!==null && savedBulan!=='' && parseInt(savedBulan)===i) o.selected=true; else if(savedBulan===null && i===new Date().getMonth()) o.selected=true; fBulan.appendChild(o); });
 fTahun.innerHTML='';
 for(var y=2026;y<=2030;y++){ var o=document.createElement('option'); o.value=y; o.textContent=y; if(savedTahun && parseInt(savedTahun)===y) o.selected=true; else if(!savedTahun && y===new Date().getFullYear()) o.selected=true; fTahun.appendChild(o); }
 if(savedGP){ var gpEl=document.getElementById('inputGP'); if(gpEl) gpEl.value=savedGP; }
 fBulan.addEventListener('change', function(){ saveLocal(); renderCalendar(); renderRiwayat(); });
 fTahun.addEventListener('change', function(){ saveLocal(); renderCalendar(); renderRiwayat(); });
 var gpEl2=document.getElementById('inputGP');
 if(gpEl2){ gpEl2.addEventListener('input', function(){ saveLocal(); recalc(); }); }
}

function renderCalendar(){
 var year=currentCal.getFullYear(); var month=currentCal.getMonth();
 document.getElementById('calMonthYear').textContent=monthNames[month]+' '+year;
 var firstDay=new Date(year,month,1).getDay();
 var daysInMonth=new Date(year,month+1,0).getDate();
 var grid=document.getElementById('calGrid');
 grid.innerHTML='';
 ['Mg','Sn','Sl','Rb','Km','Jm','Sb'].forEach(function(d){ var el=document.createElement('div'); el.className='cal-weekday'; el.textContent=d; grid.appendChild(el); });
 for(var i=0;i<firstDay;i++){ var e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
 for(var d=1;d<=daysInMonth;d++){
   var dayEl=document.createElement('div'); dayEl.className='cal-day'; dayEl.textContent=d;
   if(selectedTglManual){ var sd=new Date(selectedTglManual); if(sd.getDate()===d && sd.getMonth()===month && sd.getFullYear()===year) dayEl.classList.add('active'); }
   (function(day){ dayEl.onclick=function(){ selectManualDate(day); }; })(d);
   grid.appendChild(dayEl);
 }
}
function selectManualDate(day){
 var year=currentCal.getFullYear(); var month=currentCal.getMonth();
 var mm=String(month+1).padStart(2,'0'); var dd=String(day).padStart(2,'0');
 selectedTglManual=year+'-'+mm+'-'+dd;
 renderCalendar();
}
function changeMonth(dir){
 currentCal.setMonth(currentCal.getMonth()+dir);
 renderCalendar();
}
function getDaysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function saveGP(){
 var gpEl=document.getElementById('inputGP');
 var gp=gpEl?gpEl.value:'5000000';
 localStorage.setItem('TUL_GP', gp);
 saveLocal();
 recalc();
 var st=document.getElementById('gpStatus');
 if(st){ st.style.display='block'; st.textContent='✅ GP Rp '+parseInt(gp).toLocaleString('id-ID')+' tersimpan!'; setTimeout(function(){ st.style.display='none'; toggleGP(); }, 1000); }
}
function saveLocal(){
 var gpEl=document.getElementById('inputGP');
 var gp=gpEl?gpEl.value:'5000000';
 var fBulan=document.getElementById('fBulan');
 var fTahun=document.getElementById('fTahun');
 localStorage.setItem('TUL_DATA', JSON.stringify(data));
 localStorage.setItem('TUL_GP', gp);
 if(fBulan) localStorage.setItem('TUL_BULAN', fBulan.value);
 if(fTahun) localStorage.setItem('TUL_TAHUN', fTahun.value);
}

function renderRiwayat(){ 
 try{ localStorage.setItem('TUL_DATA', JSON.stringify(data)); }catch(e){}
 var bulan=parseInt(document.getElementById('fBulan').value);
 var tahun=parseInt(document.getElementById('fTahun').value);
 if(isNaN(bulan)||isNaN(tahun)) return;
 var days=getDaysInMonth(tahun,bulan);
 var tbody=document.querySelector('#tblRiwayat tbody');
 tbody.innerHTML='';
 for(var d=1;d<=days;d++){
   var mm=String(bulan+1).padStart(2,'0'); var dd=String(d).padStart(2,'0');
   var key=tahun+'-'+mm+'-'+dd;
   var r=data[key]||{idx1:'',idx2:''};
   var selisih=''; var status=''; var cls='';
   if(r.idx1!=='' && r.idx2!==''){ selisih=(parseFloat(r.idx1)-parseFloat(r.idx2)).toFixed(1); status=Math.abs(parseFloat(selisih))<0.01?'OK':'Beda'; cls=status==='OK'?'cocok':'beda'; }
   else if(r.idx1!==''||r.idx2!==''){ selisih=r.idx1!==''?r.idx1:'-'+r.idx2; status=r.idx1!==''?'PDF':'Man'; cls='hanya'; }
   var displayTgl=dd+'/'+mm;
   tbody.innerHTML+='<tr><td>'+displayTgl+'</td><td>'+(r.idx1!==''?r.idx1:'-')+'</td><td>'+(r.idx2!==''?r.idx2:'-')+'</td><td>'+(selisih?selisih+'<br><span class="badge '+cls+'">'+status+'</span>':'-')+'</td></tr>';
 }
 recalc();
}
function addManual(){
 if(!selectedTglManual){ alert('Pilih tanggal di kalender'); return; }
 if(!data[selectedTglManual]) data[selectedTglManual]={idx1:'',idx2:''};
 data[selectedTglManual].idx2=getIdx(selectedJam); saveLocal();
 var parts=selectedTglManual.split('-');
 document.getElementById('fBulan').value=parseInt(parts[1])-1;
 document.getElementById('fTahun').value=parseInt(parts[0]);
 currentCal=new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
 renderCalendar(); renderRiwayat();
 // Auto-sync manual ke Sheet
 setTimeout(function(){ saveToSheet(); }, 300);
}
function recalc(){ saveLocal();
 var gaji=parseFloat(document.getElementById('inputGP').value)||5000000;
 var upah=gaji/173; var idx1=0, idx2=0;
 Object.values(data).forEach(function(r){ if(r.idx1!=='') idx1+=parseFloat(r.idx1)||0; if(r.idx2!=='') idx2+=parseFloat(r.idx2)||0; });
 document.getElementById('tIdxPDF').textContent=idx1;
 document.getElementById('tIdxMan').textContent=idx2;
 document.getElementById('tUpPDF').textContent='Rp '+(idx1*upah).toLocaleString('id-ID');
 document.getElementById('tUpMan').textContent='Rp '+(idx2*upah).toLocaleString('id-ID');
}
document.getElementById('pdfFile').addEventListener('change', async function(e){
 var file=e.target.files[0]; if(!file) return;
 var label=document.querySelector('label[for="pdfFile"]');
 if(label) label.textContent='Membaca PDF...';
 try{
   var buf=await file.arrayBuffer(); 
   var pdf=await pdfjsLib.getDocument({data:buf}).promise; 
   var fullText='';
   for(var i=1;i<=pdf.numPages;i++){ 
     var page=await pdf.getPage(i); 
     var c=await page.getTextContent(); 
     var pageText=c.items.map(function(it){ return it.str; }).join(' ');
     fullText+=' '+pageText;
   }
   var extracted=[];
   var months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12',Januari:'01',Februari:'02',Maret:'03',April:'04',Mei:'05',Juni:'06',Juli:'07',Agustus:'08',September:'09',Oktober:'10',November:'11',Desember:'12'};
   var dateRegex=/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)\s+(\d{4})/gi;
   var match;
   var matches=[];
   while((match=dateRegex.exec(fullText))!==null){
     matches.push({full:match[0], day:match[1], mon:match[2], year:match[3], index:match.index});
   }
   var tulValues=[1.5,3.5,5.5,7.5,10,12,14,17];
   matches.forEach(function(m,i){
     var start=m.index;
     var end=matches[i+1]?matches[i+1].index:start+500;
     var snippet=fullText.substring(start, Math.min(end, start+500));
     var foundTul=null;
     var tulRegex=/\b(1\.5|3\.5|5\.5|7\.5|10|12|14|17)\b/g;
     var tulMatches=snippet.match(tulRegex);
     if(tulMatches && tulMatches.length>0){
       foundTul=parseFloat(tulMatches[tulMatches.length-1]);
     } else {
       var nums=snippet.match(/\d+(?:\.\d+)?/g);
       if(nums){
         for(var n=nums.length-1;n>=0;n--){
           var val=parseFloat(nums[n]);
           if(tulValues.indexOf(val)!==-1){ foundTul=val; break; }
         }
         if(foundTul===null){
           for(var n=nums.length-1;n>=0;n--){
             var val=parseFloat(nums[n]);
             if(val>=1 && val<=8 && Number.isInteger(val)){
               var mapJam={1:1.5,2:3.5,3:5.5,4:7.5,5:10,6:12,7:14,8:17};
               if(mapJam[val]){ foundTul=mapJam[val]; break; }
             }
           }
         }
       }
     }
     if(foundTul!==null){
       var monKey=m.mon.substring(0,3);
       var mm=months[monKey]||months[m.mon]||'10';
       var iso=m.year+'-'+mm+'-'+String(m.day).padStart(2,'0');
       extracted.push({tgl:iso, idx:foundTul});
     }
   });
   if(extracted.length===0){
     var tulRegex2=/\b(1\.5|3\.5|5\.5|7\.5|10|12|14|17)\b/g;
     var allNums=fullText.match(tulRegex2);
     if(allNums){
       var bulan=parseInt(document.getElementById('fBulan').value);
       var tahun=parseInt(document.getElementById('fTahun').value);
       allNums.forEach(function(n,idx){
         if(idx<31){
           var mm=String(bulan+1).padStart(2,'0'); var dd=String(idx+1).padStart(2,'0');
           var key=tahun+'-'+mm+'-'+dd;
           extracted.push({tgl:key, idx:parseFloat(n)});
         }
       });
     }
   }
   if(extracted.length===0){
     alert('PDF terbaca tapi tidak ada tanggal/index ditemukan.\nSample: '+fullText.substring(0,300));
     if(label) label.textContent='Tap untuk pilih PDF - Tidak ada data';
     return;
   }
   extracted.forEach(function(item){ 
     if(item.tgl){ 
       if(!data[item.tgl]) data[item.tgl]={idx1:'',idx2:''}; 
       data[item.tgl].idx1=item.idx; saveLocal(); 
       var p=item.tgl.split('-'); 
       document.getElementById('fBulan').value=parseInt(p[1])-1; 
       document.getElementById('fTahun').value=parseInt(p[0]); 
       currentCal=new Date(parseInt(p[0]), parseInt(p[1])-1, 1); 
     } 
   });
   renderCalendar(); renderRiwayat();
   if(label) label.textContent='PDF OK - '+extracted.length+' data TUL 1 masuk';
   setTimeout(function(){ if(label) label.textContent='📄 PDF'; }, 3000);
 }catch(err){ 
   alert('Gagal baca PDF: '+err.message); 
   var label2=document.querySelector('label[for="pdfFile"]');
   if(label2) label2.textContent='📄 PDF - Error';
 }
});
initFilters(); renderCalendar(); renderRiwayat();
</script>
